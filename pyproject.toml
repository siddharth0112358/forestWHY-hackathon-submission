[project]
name = "forestwhy"
version = "0.1.0"
description = "On-orbit deforestation detection with LFM2.5-VL and a Sentinel-2 I-JEPA encoder."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.0",
    "pillow>=10.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.23",
    "datasets>=2.19",
    "transformers>=4.47",
    "torch>=2.3",
    "torchvision>=0.18",
    "peft>=0.14",
    "gguf>=0.10",
    "streamlit>=1.35",
    "pydeck>=0.9",
    "modal>=1.4.2",
    "timm>=1.0.9",
    "einops>=0.8",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forestwhy"]

[tool.pyright]
typeCheckingMode = "strict"
