# leap-finetune job spec for fine-tuning LFM2.5-VL on the forestWHY 14-panel dataset.
# Mirrors wildfire-prevention/configs/wildfire_finetune_modal.yaml.
#
# Run (after `pip install leap-finetune` and `modal token new`):
#     leap-finetune run configs/forestwhy_finetune_modal.yaml
#
# Inputs:
#   - prepared dataset on a Modal volume at /vol/forestwhy_train  (see scripts/prepare_dataset.py)
#   - LFM2.5-VL base weights pulled from Hugging Face on first run

project: forestwhy

# ─── Compute ──────────────────────────────────────────────────────────────
gpu: H100
gpu_count: 1
modal_app: forestwhy-finetune
volume:
  name: forestwhy
  mount: /vol/forestwhy

# ─── Model ────────────────────────────────────────────────────────────────
base_model: LiquidAI/LFM2.5-VL-1.6B
model_dtype: bfloat16
freeze_vision_tower: false      # 14-panel input differs from the LFM2-VL pretraining
freeze_mmproj: false

# ─── Data ─────────────────────────────────────────────────────────────────
train_jsonl: /vol/forestwhy/train.jsonl
val_jsonl:   /vol/forestwhy/val.jsonl
images_root: /vol/forestwhy/images
max_image_count: 14
max_seq_len: 8192

# ─── Optimizer / schedule ─────────────────────────────────────────────────
optimizer:
  name: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
scheduler:
  name: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
batch_size: 4
grad_accum: 4
epochs: 3
gradient_checkpointing: true

# ─── PEFT (off by default; full-finetune was used for the published weights) ─
use_peft: false
peft:
  r: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# ─── Eval / checkpointing ─────────────────────────────────────────────────
eval_steps: 200
save_steps: 500
keep_last_n_checkpoints: 3
log_every_steps: 25

# ─── Output ───────────────────────────────────────────────────────────────
output_dir: /vol/forestwhy/runs/lfm25vl-fullft
push_to_hub:
  repo_id: Siddharth63/LFM2.5-forestWHY
  private: false

# ─── Reproducibility ──────────────────────────────────────────────────────
seed: 42
